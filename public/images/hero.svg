  <text x="600" y="300" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="92" font-weight="800">GAME WIKI</text>
  <text x="600" y="380" text-anchor="middle" fill="#c7d2fe" font-family="system-ui,sans-serif" font-size="32">Open-source Astro framework</text>
